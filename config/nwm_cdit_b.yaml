# Phase A frozen inference configuration for the official 200M CDiT/B checkpoint.
run_name: nwm_cdit_b
results_dir: logs
train: false
phase_a_frozen: true
batch_size: 16
num_workers: 8
model: CDiT-B/2
lr: 8e-5

normalize: true
grad_clip_val: 10.0
context_size: 4

distance:
  min_dist_cat: -64
  max_dist_cat: 64

len_traj_pred: 64
image_size: 224

datasets:
  recon:
    data_folder: data/recon
    train: data_splits/recon/train/
    test: data_splits/recon/test/
    goals_per_obs: 4
  tartan_drive:
    data_folder: data/tartan
    train: data_splits/tartan_drive/train/
    test: data_splits/tartan_drive/test/
    goals_per_obs: 4
  sacson:
    data_folder: data/sacson
    train: data_splits/sacson/train
    test: data_splits/sacson/test
    goals_per_obs: 4
  scand:
    data_folder: data/scand
    train: data_splits/scand/train
    test: data_splits/scand/test
    goals_per_obs: 4
